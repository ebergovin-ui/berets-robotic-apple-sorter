name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: software/flask_app
    env:
      BERETS_REAL_MANIPULATOR: "0"
      BERETS_REAL_CONTAINER_SENSORS: "0"
      BERETS_REAL_CONVEYOR: "0"
      BERETS_REAL_RAIL: "0"
      BERETS_REAL_CYCLE: "0"
      BERETS_REAL_DISPENSER: "0"
      BERETS_AUTO_CONTAINER_EXCHANGE: "0"
      BERETS_AUTO_START_VISION: "0"
      BERETS_SECRET_KEY: test-only-secret
      BERETS_SYSTEM_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: software/flask_app/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q .
